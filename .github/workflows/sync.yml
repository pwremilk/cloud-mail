# Track upstream maillab/cloud-mail via MERGE (not reset).
# Merge keeps fork-only files and lets upstream win conflicts (-X theirs).
# NOTE 2026-10-25: upstream may itself change files under .github/workflows
# (e.g. deploy-cloudflare.yml). GITHUB_TOKEN can NEVER push workflow files
# (GitHub hard limitation; there is no `workflows` permissions key). Strategy:
# merge everything, then HOLD BACK workflow-file changes (fork copy stays),
# push succeeds, and the run goes RED with a held-files list => a human
# applies the upstream workflow diff once; next syncs stay green.
name: sync-upstream
on:
  schedule:
    # twice a day off the top of the hour to dodge schedule congestion
    - cron: '23 3,15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream into main
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/maillab/cloud-mail || true
          git fetch --no-tags upstream main
          UP=$(git rev-parse upstream/main)
          HERE=$(git rev-parse HEAD)

          if [ "$UP" = "$HERE" ]; then
            echo "upstream unchanged"; exit 0
          fi
          if git merge-base --is-ancestor "$UP" "$HERE"; then
            echo "already merged upstream $UP"; exit 0
          fi

          echo "merging upstream $UP into $HERE"
          # upstream wins any conflict; this fork's own extra files survive
          git merge --no-edit -X theirs -m "sync: merge upstream $UP" "$UP"

          # GITHUB_TOKEN cannot touch .github/workflows => hold those files back
          WF_HELD=$(git diff --name-only ORIG_HEAD HEAD -- .github/workflows/ || true)
          if [ -n "$WF_HELD" ]; then
            git checkout ORIG_HEAD -- .github/workflows/
            git commit -m "sync: hold upstream workflow-file changes (needs human apply)"
            {
              echo "## Upstream workflow-file changes held back"
              echo '```'
              echo "$WF_HELD"
              echo '```'
              echo "Fork versions kept; push succeeded. A human must apply the upstream diff once, then this red flag disappears."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          git push origin "HEAD:main"
          echo "merged and pushed"

          if [ -n "$WF_HELD" ]; then
            echo "::error::upstream changed workflow files and they were HELD BACK (fork version kept): $(echo $WF_HELD) - human: apply upstream diff manually, then this red flag disappears"
            exit 1
          fi

      - name: Keepalive against 60-day schedule auto-disable
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub auto-disables schedules after 60 days without commits.
          # Touch a timestamp if the newest commit is older than 40 days.
          git fetch --no-tags origin main
          LAST=$(git log -1 --format=%ct origin/main)
          NOW=$(date +%s)
          if [ $(( (NOW - LAST) / 86400 )) -ge 40 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .sync-keepalive
            git add .sync-keepalive
            git commit -m "chore: sync keepalive [skip ci]"
            git push origin "HEAD:main"
            echo "keepalive commit pushed"
          else
            echo "repo fresh enough, no keepalive needed"
          fi
