# Track upstream maillab/cloud-mail via MERGE (not reset).
# Why merge: GITHUB_TOKEN (GitHub App) is not allowed to create/update files
# under .github/workflows, so a hard-reset + re-create approach can never
# restore this workflow on its own. With a merge, this fork-only file is
# preserved automatically by git (upstream has no such file => no conflict),
# upstream-owned files always win conflicts (-X theirs), and nothing ever
# writes to .github/workflows => this workflow can never be deleted by syncing.
name: sync-upstream
on:
  schedule:
    # twice a day, off the top of the hour to dodge schedule congestion
    - cron: '23 3,15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream into main
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/maillab/cloud-mail || true
          git fetch --no-tags upstream main
          UP=$(git rev-parse upstream/main)
          HERE=$(git rev-parse HEAD)

          if [ "$UP" = "$HERE" ]; then
            echo "upstream unchanged"; exit 0
          fi
          if git merge-base --is-ancestor "$UP" "$HERE"; then
            echo "already merged upstream $UP"; exit 0
          fi

          echo "merging upstream $UP into $HERE"
          # upstream wins any conflict; this fork's own extra files survive
          git merge --no-edit -X theirs -m "sync: merge upstream $UP" "$UP"
          git push origin "HEAD:main"
          echo "merged and pushed"

      - name: Keepalive against 60-day schedule auto-disable
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub auto-disables schedules after 60 days without commits.
          # Touch a timestamp if the newest commit is older than 40 days.
          git fetch --no-tags origin main
          LAST=$(git log -1 --format=%ct origin/main)
          NOW=$(date +%s)
          if [ $(( (NOW - LAST) / 86400 )) -ge 40 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .sync-keepalive
            git add .sync-keepalive
            git commit -m "chore: sync keepalive [skip ci]"
            git push origin "HEAD:main"
            echo "keepalive commit pushed"
          else
            echo "repo fresh enough, no keepalive needed"
          fi
